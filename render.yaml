services:
  # 1. FastAPI Multi-Hazard Risk Backend Service
  - type: web
    name: mausamguard-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./mausamguard.db
    healthCheckPath: /api/v1/health

  # 2. React + Vite Early Warning Dashboard (Free Static Hosting)
  - type: static
    name: mausamguard-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mausamguard-backend
          property: host
