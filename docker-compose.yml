version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mausamguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mausamguard.db
      - ENVIRONMENT=production
      - JWT_SECRET=MausamGuardNepalProductionSecretKey2026!
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1/forecast
      - DHM_BASE_URL=http://hydrology.gov.np
    volumes:
      - ./data:/app/data
      - ./mausamguard.db:/app/mausamguard.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mausamguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: mausamguard_network
